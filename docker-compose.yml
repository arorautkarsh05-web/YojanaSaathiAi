version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: yojanasaathi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yojanasaathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?CRITICAL: POSTGRES_PASSWORD must be set in production environment}
      POSTGRES_DB: ${POSTGRES_DB:-yojanasaathi_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yojanasaathi_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yojanasaathi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yojanasaathi_db}
      SECRET_KEY: ${SECRET_KEY:?CRITICAL: SECRET_KEY must be set in environment}
      ENV: ${ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yojanasaathi_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

