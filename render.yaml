# ==============================================================================
# YojanaSaathi AI — Render Infrastructure as Code (Render Blueprint)
# Deploys:
#   1. yojanasaathi-backend (FastAPI Python Web Service with Health Checks)
#   2. yojanasaathi-frontend (React 19 + Vite Static Site with SPA Rewrites)
#   3. yojanasaathi-db (Render Managed PostgreSQL Database)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: yojanasaathi-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: ADMIN_INITIAL_EMAIL
        value: admin@yojanasaathi.up.gov.in
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        fromDatabase:
          name: yojanasaathi-db
          property: connectionString

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React 19 + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: yojanasaathi-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: yojanasaathi-backend
          property: host

databases:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: yojanasaathi-db
    databaseName: yojanasaathi
    user: yojanasaathi_user
    plan: free
    region: oregon
